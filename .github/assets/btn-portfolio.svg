<svg xmlns="http://www.w3.org/2000/svg" width="170" height="58" viewBox="0 -3 170 61" role="img" aria-label="My portfolio"><title>My portfolio</title>
<defs><filter id="bg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
<linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9459"/><stop offset="1" stop-color="#FF5A17"/></linearGradient>
<linearGradient id="bs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="bs2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="bc"><rect width="170" height="52" rx="26"/></clipPath></defs>
<style>.s{font-family:'Geist','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.bsweep{animation:bs 4.2s cubic-bezier(.65,0,.35,1) infinite}@keyframes bs{0%{transform:translateX(0)}45%,100%{transform:translateX(410px)}}
.glow{animation:gl 2.8s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.35}50%{opacity:.7}}
.nudge{animation:nd 2.8s cubic-bezier(.16,1,.3,1) infinite}@keyframes nd{0%,60%,100%{transform:translateX(0)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="170" height="52" rx="26" fill="#fff" fill-opacity=".04" stroke="#A0ACC4" stroke-opacity=".28"/><g clip-path="url(#bc)"><rect x="-120" width="90" height="52" fill="url(#bs2)" class="bsweep" style="animation-delay:1.2s"/></g><rect x="1" y="1" width="168" height="24" rx="24" fill="#fff" fill-opacity=".035"/><text x="26" y="32" class="s" font-size="16" font-weight="600" fill="#F4F5F7">My portfolio</text><g stroke="#F4F5F7" stroke-width="1.8" fill="none"><circle cx="140" cy="26" r="7.5"/><path d="M132.5 26h15M140 18.5c3 3 3 12 0 15M140 18.5c-3 3-3 12 0 15"/></g></svg>